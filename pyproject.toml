[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autonomous-spec-to-pr"
version = "0.1.0"
description = "Autonomous Spec-to-PR & QA Multi-Agent System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "langgraph>=0.2.45",
    "langgraph-checkpoint-postgres>=2.0.4",
    "psycopg[binary,pool]>=3.2.3",
    "langchain-core>=0.3.15",
    "langchain-google-genai>=2.0.4",
    "mcp[cli]>=1.1.0",
    "qdrant-client>=1.12.1",
    "fastembed>=0.4.1",
    "rank-bm25>=0.2.2",
    "pytest>=8.3.3",
    "httpx>=0.27.2",
]

[tool.pytest.ini_options]
pythonpath = [".", "target_repo"]
testpaths = ["tests", "target_repo/tests"]
addopts = "-v --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["src"]

